<!DOCTYPE html>
<html>

<head>
    <title>Seller Registration</title>
</head>
<style>
    body {
        background-color: #6a8f47;
        font-family: Arial, sans-serif;
    }

    .container {
        width: 400px;
        margin: 100px auto;
        padding: 10px;
        background-color: #ada18e;
        border-radius: 5px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);

    }

    h2 {
        text-align: center;
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-bottom: 2px;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    textarea {
        width: 90%;
        padding: 10px;
        margin-bottom: -15px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }

    input[type="submit"] {
        width: 90%;
        padding: 10px;
        background-color: #3c85c2;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }

    input[type="submit"]:hover {
        background-color: #2782d8;
    }

    a {
        display: block;
        text-align: center;
        margin-top: 10px;
    }

    h1 {
        text-align: center;
        color: #fff;
        margin-top: 20px;
    }
</style>
<h1> Sell your products with Easymart Easily :)</h1>
<marquee>
    <h2>...! Put your products in front of buyers who are ready to purchase !..</h2>
</marquee>

<body>
    <div class="container">

        <h3>Seller Registration</h3>

        <form action="/seller/register" method="POST">

            <label>Shop Name</label><br>
            <input type="text" name="shop_name" required><br><br>

            <label>Owner Name</label><br>
            <input type="text" name="owner_name" required><br><br>

            <label>Email</label><br>
            <input type="email" name="email" required><br><br>

            <label>Phone Number</label><br>
            <input type="text" name="phone" required><br><br>

            <label>Password</label><br>
            <input type="password" name="password" required><br><br>

            <label>Address</label><br>
            <textarea name="address"></textarea><br><br>

            <input type="submit" value="Register">

        </form>

        <br>

        <a href="/seller/login">Already have an account? Login</a>

</body>

</html>
