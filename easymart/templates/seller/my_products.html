<!DOCTYPE html>
<html>

<head>
    <title>My Products</title>
</head>

<body>

    <h2>My Products</h2>

    <table border="1" cellpadding="10">

        <tr>
            <th>Image</th>
            <th>Product Name</th>
            <th>Category</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Action</th>
        </tr>

        {% for product in products %}

        <tr>

            <td>
                <img src="{{ url_for('static', filename='uploads/' + product[6]) }}" width="100">
            </td>

            <td>{{ product[1] }}</td>

            <td>{{ product[2] }}</td>

            <td>₹ {{ product[3] }}</td>

            <td>{{ product[4] }}</td>

            <td>
                <a href="/seller/edit-product/{{ product[0] }}">Edit</a> |
                <a href="/seller/delete-product/{{ product[0] }}">Delete</a>
            </td>

        </tr>

        {% endfor %}

    </table>

    <br>

    <a href="/seller/dashboard">Back</a>

</body>

</html>
