<!DOCTYPE html>
<html>

<head>
    <title>Customer Login</title>

</head>
<h1 style="text-align: center; color: rgb(243, 243, 243);">WELCOME TO EASYMART
    <p>Shop Latest Products</p>

</h1>
<style>
    .container {
        display: flex;
        justify-content: right;
        align-items: center;
        height: 80vh;
        padding-right: 60px;

    }

    body {
        background-image: url("{{ url_for('static', filename='images/image4.avif') }}");
        background-repeat: no-repeat;
        background-size: cover;
        background-position: center;
        background-attachment: flex;
    }

    h2 {
        text-align: center;
        margin-bottom: 20px;

    }

    input[type="email"],
    input[type="password"] {
        width: 90%;
        padding: 10px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }

    input[type="submit"] {
        width: 90%;
        padding: 10px;
        background-color: #3c85c2;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }
</style>

<body>


    <div class="container">
        <div style="color: white;">

            <table border="1" color="red" cellpadding="10">
                <tr>
                    <td>
                        <h2>CUSTOMER LOGIN</h2><br><br>

                        <form action="/login" method="POST">

                            <label>Email</label><br>
                            <input type="email" name="email" required><br><br>

                            <label>Password</label><br>
                            <input type="password" name="password" required><br><br>

                            <input type="submit" value="Login"><br><br>

                            <h3>Don't have an account? <a href="/register">Register</a></h3>
                        </form>
                    </td>
                </tr>
            </table>

            </form>
        </div>

        <footer
            style="position: absolute; bottom: -50px; width: 100%; background-color: #131921; color: white; text-align: center; padding: 10px;">
            &copy; 2024 Easymart. All rights reserved.
        </footer>
</body>

</html>
